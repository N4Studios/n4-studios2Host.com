
name: Deploy Main Website

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Download the main website repository
      - name: Checkout Main Website
        uses: actions/checkout@v7
        with:
          path: main

      # 2. Download secondary repositories

      - name: Checkout ComputerSimulator
        uses: actions/checkout@v7
        with:
          repository: N4Studios/ComputerSimulator
          path: Projects/ComputerSimulator

      - name: Checkout BeginnersStart
        uses: actions/checkout@v7
        with:
          repository: N4Studios/BeginnersStart
          path: Projects/BeginnersStart

      - name: Checkout SEMAG
        uses: actions/checkout@v7
        with:
          repository: N4Studios/SEMAG
          path: Projects/SEMAG

      - name: Checkout ColorLand5
        uses: actions/checkout@v7
        with:
          repository: N4Studios/ColorLand5
          path: Projects/ColorLand5

      # 3. Assemble Website
      - name: Assemble Website
        run: |
          mkdir -p _site

          # Copy main website
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            main/ _site/

          # Copy ComputerSimulator
          mkdir -p _site/Projects/ComputerSimulator
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            Projects/ComputerSimulator/ \
            _site/Projects/ComputerSimulator/

          # Copy BeginnersStart
          mkdir -p _site/Projects/BeginnersStart
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            Projects/BeginnersStart/ \
            _site/Projects/BeginnersStart/

          # Copy SEMAG
          mkdir -p _site/Projects/SEMAG
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            Projects/SEMAG/ \
            _site/Projects/SEMAG/

          # Copy ColorLand5
          mkdir -p _site/Projects/ColorLand5
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            Projects/ColorLand5/ \
            _site/Projects/ColorLand5/

          touch _site/.nojekyll

      # 4. Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 5. Upload assembled website
      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # 6. Deploy Website
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
